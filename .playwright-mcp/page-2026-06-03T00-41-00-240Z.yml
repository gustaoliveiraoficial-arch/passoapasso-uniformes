                                - heading "Por que ativar?" [level=3]
                                - paragraph:
                                  - text: Sabia que 24% de todas as vendas feitas com cartão de crédito na Hotmart em 2021 foram recusadas por saldo insuficiente no cartão de crédito? E que em média 60% dos clientes que parcelam suas compras escolhem pagar em 12 vezes?
                                  - text: Essas vendas perdidas poderiam ser recuperadas usando nossa ferramenta de recuperador de vendas para assinaturas.
                                - heading "Como funciona?" [level=3]
                                - paragraph:
                                  - text: O
                                  - strong: recuperador de vendas
                                  - text: para assinaturas está disponível para produtos que tenham planos anuais e que ofereçam como meio de pagamento o parcelamento em 12 vezes no cartão de crédito. O objetivo do recuperador de vendas para assinaturas é ajudar você
                                  - strong: aumentar sua taxa de conversão na adesão e otimizar seu CAC (custo de aquisição de cliente).
                                - paragraph: Quando ativado, é criado automaticamente um plano mensal associado ao plano anual. Para definir o valor automaticamente, nosso sistema considera o valor do plano anual e divide por 12. Esta divisão acontece, pois o recuperador só está disponível para compras parceladas em 12 vezes.
                                - paragraph:
                                  - text: "Por exemplo: se você tem um plano anual sendo"
                                  - strong: vendido por R$ 1.000,00
                                  - text: e ativa esta funcionalidade, o recuperador criará um plano mensal automaticamente,
                                  - strong: dividindo este valor em 12 mensalidades
                                  - text: ", ou seja, será criado um plano mensal"
                                  - strong: de R$ 83,33 para o seu cliente.
                                - paragraph:
                                  - strong: "Importante:"
                                  - text: Ao recuperar uma assinatura na adesão, não há garantia de que os pagamentos futuros serão realizados. Sendo assim, você assume exclusivamente o risco da eventual inadimplência do Comprador.
                                  - strong: Para ajudá-lo na sua gestão de inadimplência, a Hotmart oferece outras ferramentas para recuperar recorrências atrasadas de forma automática, como o recuperador de recorrências atrasadas.
