<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Kommo Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #eee;
      font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 16px;
      border-bottom: 2px solid #e44d26;
    }
    .header h1 { font-size: 14px; font-weight: 700; color: #fff; }
    .header p  { font-size: 11px; color: #e44d26; margin-top: 2px; }
    .section { padding: 12px 16px; border-bottom: 1px solid #1e1e30; }
    .section h2 { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 1px; margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #999; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%; background: #16213e; border: 1px solid #333;
      border-radius: 6px; color: #eee; padding: 7px 10px;
      font-size: 12px; margin-bottom: 10px; outline: none;
    }
    input:focus { border-color: #e44d26; }
    button {
      background: #e44d26; color: #fff; border: none; border-radius: 6px;
      padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.15s; width: 100%;
    }
    button:hover { background: #c0392b; }
    button.secondary {
      background: #16213e; border: 1px solid #333; margin-bottom: 8px;
    }
    button.secondary:hover { border-color: #e44d26; }
    #status {
      padding: 6px 10px; border-radius: 5px; font-size: 11px;
      margin-top: 8px; display: none;
    }
    #status.ok    { background: #1a3a2a; color: #4caf50; display: block; }
    #status.error { background: #3a1a1a; color: #e74c3c; display: block; }
    #status.info  { background: #1a1a2e; color: #aaa; display: block; }
    .stages-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; margin-top: 6px; }
    .stage-item {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      background: #16213e; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    .stage-item:hover { background: #1e2d50; }
    .stage-item input[type="checkbox"] { margin: 0; flex-shrink: 0; }
    .stage-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .stage-name { flex: 1; }
    .stage-pipeline { font-size: 10px; color: #555; }
    .hint { font-size: 10px; color: #555; }
    .footer { padding: 8px 16px; font-size: 10px; color: #333; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ WhatsApp Kommo Bridge</h1>
    <p>Passo a Passo Uniformes</p>
  </div>

  <div class="section">
    <h2>Configuração</h2>
    <label>Subdomínio Kommo (sem .kommo.com)</label>
    <input type="text" id="subdomain" placeholder="passoapassouniformes2025" />
    <p class="hint" style="margin-bottom:10px">Você precisa estar logado no Kommo no Chrome.</p>
    <button id="btn-save">Salvar e testar conexão</button>
    <div id="status"></div>
  </div>

  <div class="section">
    <h2>Etapas favoritas</h2>
    <p class="hint" style="margin-bottom:8px">Selecione as etapas que aparecem como botão rápido. Deixe vazio para mostrar todas.</p>
    <button class="secondary" id="btn-load-stages">Carregar etapas do Kommo</button>
    <div id="stages-list" class="stages-list"></div>
    <button id="btn-save-stages" style="display:none;margin-top:8px">Salvar etapas favoritas</button>
  </div>

  <div class="section">
    <h2>Sincronização</h2>
    <div id="sync-info" class="hint" style="margin-bottom:8px">Carregando...</div>
    <button class="secondary" id="btn-sync-now">↻ Sincronizar agora</button>
  </div>

  <div class="footer">v2.0 — Passo a Passo Uniformes</div>
  <script src="popup.js"></script>
</body>
</html>
